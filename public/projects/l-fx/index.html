<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-FX</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="description" content="Efek didalam kotak tangan berbentuk L">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="auto-toggle-wrapper">
        <span class="toggle-label">Ganti Otomatis</span>
        <label class="switch">
            <input type="checkbox" id="autoChangeToggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="main-wrapper">
        <div class="container">
            <video id="input_video" style="display: none;"></video>
            <canvas id="output_canvas" width="640" height="480"></canvas>
        </div>
        <div class="controls" id="controlsContainer"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
