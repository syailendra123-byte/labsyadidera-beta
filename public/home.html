<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/topicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - LabSyadidera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b1120 0%, #0f172a 40%, #1e293b 100%);
      color: #e2e8f0;
      padding: 28px 20px 48px;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* ===== PARTICLES ===== */
    .bg-particles {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 3px; height: 3px;
      background: rgba(56, 189, 248, 0.35);
      border-radius: 50%;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
    }

    .container {
      position: relative; z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* ===== TOPBAR ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 14px 22px;
      margin-bottom: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      animation: slideDown 0.5s ease-out;
      flex-wrap: wrap;
      gap: 12px;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .profile-area {
      display: flex; align-items: center; gap: 14px;
      flex: 1;
    }
    .profile-area img {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.08);
      transition: all 0.2s ease;
    }
    .profile-area img:hover {
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
      transform: scale(1.05);
    }
    .profile-info .name { font-weight: 600; font-size: 15px; color: #f1f5f9; }
    .profile-info .email { font-size: 12px; color: #64748b; margin-top: 2px; }
    .profile-info .access-level {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; color: #38bdf8;
      margin-top: 4px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.15);
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 500;
    }
    .profile-info .access-level::before {
      content: '';
      width: 6px; height: 6px;
      background: #38bdf8;
      border-radius: 50%;
    }
    .btn-logout {
      background: rgba(248,113,113,0.1);
      color: #f87171;
      border: 1px solid rgba(248,113,113,0.25);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-logout:hover {
      background: rgba(248,113,113,0.2);
      border-color: rgba(248,113,113,0.4);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(248,113,113,0.15);
    }
    .btn-logout svg { width: 14px; height: 14px; }

    /* ===== WELCOME ===== */
    .welcome-section {
      margin-bottom: 24px;
      animation: fadeIn 0.6s ease-out 0.1s both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .welcome-section h2 {
      font-size: 24px; font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #f1f5f9, #94a3b8);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
    }
    .welcome-section .subtitle {
      color: #64748b; font-size: 14px;
    }

    /* ===== PROJECTS ===== */
    .projects-area {
      animation: fadeIn 0.6s ease-out 0.2s both;
    }

    /* Desktop: grid kotak */
    @media (min-width: 769px) {
      .projects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 18px;
      }
    }
    /* HP: list */
    @media (max-width: 768px) {
      .projects-grid {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
    }

    /* ===== PROJECT CARD ===== */
    .proj-card {
      position: relative;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      min-height: 180px;
    }

    /* Top accent line */
    .proj-card::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* iframe preview - hidden by default */
    .proj-preview {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      opacity: 0;
      transform: scale(1.05);
      transition: all 0.4s ease;
      pointer-events: none;
      z-index: 1;
      border-radius: 16px;
    }

    /* Card content */
    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      flex: 1;
      transition: all 0.35s ease;
    }

    .proj-card .tag {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px;
      background: rgba(56,189,248,0.1);
      color: #38bdf8;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
      font-weight: 500;
      border: 1px solid rgba(56,189,248,0.15);
      align-self: flex-start;
      transition: all 0.3s ease;
    }
    .proj-card .tag::before {
      content: '';
      width: 5px; height: 5px;
      background: #38bdf8;
      border-radius: 50%;
    }

    .proj-card h3 {
      font-size: 16px; font-weight: 600;
      margin-bottom: 10px;
      color: #f1f5f9;
      transition: all 0.3s ease;
    }

    /* Description - normal: center, 2 lines max */
    .proj-card .desc-short {
      font-size: 13px; color: #64748b;
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.5;
      margin: auto 0;
      transition: all 0.35s ease;
    }

    /* Description - full: hidden by default */
    .proj-card .desc-full {
      font-size: 13px; color: #94a3b8;
      text-align: left;
      line-height: 1.6;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: all 0.35s ease;
    }

    /* Arrow icon */
    .proj-card .arrow {
      position: absolute;
      bottom: 16px; right: 16px;
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      display: flex;
      align-items: center; justify-content: center;
      opacity: 0;
      transform: translateX(-8px);
      transition: all 0.25s ease;
      z-index: 3;
    }
    .proj-card .arrow svg {
      width: 14px; height: 14px;
      color: #38bdf8;
    }

    /* ===== DESKTOP HOVER ===== */
    @media (min-width: 769px) {
      .proj-card:hover {
        transform: scale(1.03) translateY(-4px);
        border-color: rgba(56, 189, 248, 0.3);
        box-shadow: 0 16px 50px rgba(0,0,0,0.35), 0 0 0 1px rgba(56, 189, 248, 0.08) inset;
        z-index: 10;
      }
      .proj-card:hover::before { opacity: 1; }
      .proj-card:hover .proj-preview {
        opacity: 0.15;
        transform: scale(1);
      }
      .proj-card:hover .card-content {
        background: rgba(15, 23, 42, 0.85);
        border-radius: 12px;
        padding: 12px;
        margin: -8px;
      }
      .proj-card:hover .desc-short {
        opacity: 0; max-height: 0; margin: 0;
      }
      .proj-card:hover .desc-full {
        opacity: 1; max-height: 200px; margin: auto 0;
      }
      .proj-card:hover .arrow {
        opacity: 1; transform: translateX(0);
      }
      .proj-card:hover h3 {
        color: #38bdf8;
      }
    }

    /* ===== MOBILE EXPANDED ===== */
    @media (max-width: 768px) {
      .proj-card.expanded {
        transform: scale(1.02);
        border-color: rgba(56, 189, 248, 0.4);
        box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        z-index: 10;
        min-height: 240px;
      }
      .proj-card.expanded::before { opacity: 1; }
      .proj-card.expanded .proj-preview {
        opacity: 0.12;
        transform: scale(1);
      }
      .proj-card.expanded .card-content {
        background: rgba(15, 23, 42, 0.9);
        border-radius: 12px;
        padding: 12px;
        margin: -6px;
      }
      .proj-card.expanded .desc-short {
        opacity: 0; max-height: 0; margin: 0;
      }
      .proj-card.expanded .desc-full {
        opacity: 1; max-height: 200px; margin: auto 0;
      }
      .proj-card.expanded .arrow {
        opacity: 1; transform: translateX(0);
      }
      .proj-card.expanded h3 {
        color: #38bdf8;
      }
    }

    /* ===== LOADING / EMPTY ===== */
    .loading {
      text-align: center;
      color: #64748b;
      padding: 80px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(100, 116, 139, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    .empty-state svg {
      width: 48px; height: 48px;
      margin-bottom: 16px;
      color: #475569;
    }

    /* ===== RESPONSIVE TOPBAR ===== */
    @media (max-width: 640px) {
      .topbar { padding: 12px 16px; }
      .profile-area img { width: 40px; height: 40px; }
      .welcome-section h2 { font-size: 20px; }
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="bg-particles" id="particles"></div>

  <div class="container">
    <div id="app" class="loading">
      <div class="spinner"></div>
      <span>Memuat dashboard...</span>
    </div>
  </div>

  <script>
    // Particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 20 + 's';
      p.style.animationDuration = (12 + Math.random() * 16) + 's';
      particlesContainer.appendChild(p);
    }

    // Card click handler for mobile
    function handleCardClick(card, slug, event) {
      if (window.innerWidth <= 768) {
        if (!card.classList.contains('expanded')) {
          event.preventDefault();
          event.stopPropagation();
          // Collapse any other expanded card
          document.querySelectorAll('.proj-card.expanded').forEach(c => {
            if (c !== card) c.classList.remove('expanded');
          });
          card.classList.add('expanded');
        } else {
          // Already expanded, navigate
          window.location.href = '/projects/' + slug;
        }
      }
    }

    // Collapse expanded cards when clicking outside
    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 768) {
        if (!e.target.closest('.proj-card')) {
          document.querySelectorAll('.proj-card.expanded').forEach(c => {
            c.classList.remove('expanded');
          });
        }
      }
    });

    // Load dashboard
    async function loadDashboard() {
      const res = await fetch("/api/me");
      const data = await res.json();
      const app = document.getElementById("app");

      if (!data.loggedIn) {
        window.location.replace("/");
        return;
      }

      const user = data.user;

      const projectsRes = await fetch("/api/projects");
      const projectsData = await projectsRes.json();
      const projects = projectsData.projects || [];

      app.innerHTML = `
        <div class="topbar">
          <div class="profile-area">
            <img src="${user.picture}" alt="foto profil" />
            <div class="profile-info">
              <div class="name">${user.name}</div>
              <div class="email">${user.email}</div>
              <div class="access-level">User</div>
            </div>
          </div>
          <a class="btn-logout" href="/api/auth/logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Logout
          </a>
        </div>

        <div class="welcome-section">
          <h2>Halo, ${user.name.split(" ")[0]} 👋</h2>
          <p class="subtitle">Berikut daftar Proyek - proyek yang bisa anda akses.</p>
        </div>

        <div class="projects-area">
          <div class="projects-grid">
            ${
              projects.length > 0
                ? projects.map((p) => `
                  <div class="proj-card"
                       data-slug="${p.slug}"
                       onclick="handleCardClick(this, '${p.slug}', event)">
                    <iframe class="proj-preview" src="/projects/${p.slug}" loading="lazy" tabindex="-1"></iframe>
                    <div class="card-content">
                      <span class="tag">${p.tag}</span>
                      <h3>${p.title}</h3>
                      <p class="desc-short">${p.description}</p>
                      <p class="desc-full">${p.description}</p>
                      <div class="arrow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <line x1="5" y1="12" x2="19" y2="12"/>
                          <polyline points="12 5 19 12 12 19"/>
                        </svg>
                      </div>
                    </div>
                  </div>
                `).join("")
                : `<div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                      <polyline points="14 2 14 8 20 8"/>
                      <line x1="16" y1="13" x2="8" y2="13"/>
                      <line x1="16" y1="17" x2="8" y2="17"/>
                      <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <p>Belum ada proyek yang diupload.</p>
                  </div>`
            }
          </div>
        </div>
      `;
    }

    loadDashboard();
  </script>
</body>
</html>
