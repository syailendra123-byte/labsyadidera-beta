<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/topicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - LabSyadidera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #f1f5f9;
      padding: 32px 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }

    /* Topbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 14px 24px;
      margin-bottom: 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      animation: slideDown 0.5s ease-out;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .profile { display: flex; align-items: center; gap: 14px; }
    .profile img {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
      transition: all 0.2s ease;
    }
    .profile img:hover {
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2);
      transform: scale(1.05);
    }
    .profile .name { font-weight: 600; font-size: 15px; color: #f1f5f9; }
    .profile .email { font-size: 12px; color: #64748b; margin-top: 2px; }
    .btn-logout {
      background: rgba(248,113,113,0.1);
      color: #f87171;
      border: 1px solid rgba(248,113,113,0.25);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-logout:hover { 
      background: rgba(248,113,113,0.2); 
      border-color: rgba(248,113,113,0.4);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(248,113,113,0.15);
    }
    .btn-logout svg {
      width: 14px; height: 14px;
    }

    /* Welcome Section */
    .welcome-section {
      margin-bottom: 28px;
      animation: fadeIn 0.6s ease-out 0.1s both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .welcome-section h2 { 
      font-size: 24px; 
      margin-bottom: 6px; 
      font-weight: 700;
      background: linear-gradient(90deg, #f1f5f9, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .welcome-section .subtitle { 
      color: #64748b; 
      font-size: 14px; 
    }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
      animation: fadeIn 0.6s ease-out 0.2s both;
    }
    .stat-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 16px 20px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .stat-item:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.1);
      transform: translateY(-2px);
    }
    .stat-item .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .stat-item .stat-label {
      font-size: 12px;
      color: #64748b;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      animation: fadeIn 0.6s ease-out 0.3s both;
    }
    .proj-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .proj-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .proj-card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.3);
      box-shadow: 0 12px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(56, 189, 248, 0.1) inset;
    }
    .proj-card:hover::before {
      opacity: 1;
    }
    .proj-card .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      background: rgba(56,189,248,0.1);
      color: #38bdf8;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
      font-weight: 500;
      border: 1px solid rgba(56,189,248,0.15);
    }
    .proj-card .tag::before {
      content: '';
      width: 6px; height: 6px;
      background: #38bdf8;
      border-radius: 50%;
    }
    .proj-card h3 { 
      font-size: 16px; 
      margin-bottom: 8px; 
      font-weight: 600;
      color: #f1f5f9;
    }
    .proj-card p { 
      font-size: 13px; 
      color: #64748b; 
      line-height: 1.5;
    }
    .proj-card .arrow {
      position: absolute;
      bottom: 20px; right: 20px;
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateX(-10px);
      transition: all 0.2s ease;
    }
    .proj-card:hover .arrow {
      opacity: 1;
      transform: translateX(0);
    }
    .proj-card .arrow svg {
      width: 14px; height: 14px;
      color: #38bdf8;
    }

    .loading { 
      text-align: center; 
      color: #64748b; 
      padding: 80px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(100, 116, 139, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    .empty-state svg {
      width: 48px; height: 48px;
      margin-bottom: 16px;
      color: #475569;
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="container">
    <div id="app" class="loading">
      <div class="spinner"></div>
      <span>Memuat dashboard...</span>
    </div>
  </div>

  <script>
    // Halaman ini WAJIB login. Kalau session gak valid, tendang balik ke landing page.
    async function loadDashboard() {
      const res = await fetch("/api/me");
      const data = await res.json();
      const app = document.getElementById("app");

      if (!data.loggedIn) {
        window.location.replace("/");
        return;
      }

      const user = data.user;

      // Ambil daftar proyek SECARA OTOMATIS dari folder public/projects/
      // lewat endpoint /api/projects (bukan hardcode lagi)
      const projectsRes = await fetch("/api/projects");
      const projectsData = await projectsRes.json();
      const projects = projectsData.projects || [];

      app.innerHTML = `
        <div class="topbar">
          <div class="profile">
            <img src="${user.picture}" alt="foto profil" />
            <div>
              <div class="name">${user.name}</div>
              <div class="email">${user.email}</div>
            </div>
          </div>
          <a class="btn-logout" href="/api/auth/logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Logout
          </a>
        </div>

        <div class="welcome-section">
          <h2>Halo, ${user.name.split(" ")[0]} 👋</h2>
          <p class="subtitle">Ini daftar proyek yang bisa kamu akses.</p>
        </div>

        <div class="stats-bar">
          <div class="stat-item">
            <div class="stat-value">${projects.length}</div>
            <div class="stat-label">Total Proyek</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">${new Set(projects.map(p => p.tag)).size}</div>
            <div class="stat-label">Kategori</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">User</div>
            <div class="stat-label">Level Akses</div>
          </div>
        </div>

        <div class="grid">
          ${
            projects.length > 0
              ? projects.map((p) => `
                <a href="/projects/${p.slug}" style="text-decoration:none; color:inherit;">
                  <div class="proj-card">
                    <span class="tag">${p.tag}</span>
                    <h3>${p.title}</h3>
                    <p>${p.description}</p>
                    <div class="arrow">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                      </svg>
                    </div>
                  </div>
                </a>
              `).join("")
              : `<div class="empty-state">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                  </svg>
                  <p>Belum ada proyek yang diupload.</p>
                </div>`
          }
        </div>
      `;
    }

    loadDashboard();
  </script>
</body>
</html>
