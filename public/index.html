<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/topicon.png"
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabSyadidera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f1f5f9;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .card h1 {
      font-size: 26px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .card p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .btn-google {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #1e293b;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-google:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255,255,255,0.15);
    }
    .loading {
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app" class="card">
    <p class="loading">Memuat...</p>
  </div>

  <script>
    // Cek status login begitu halaman dibuka.
    // Kalau ternyata SUDAH login (misal cookie masih valid), langsung
    // tendang ke /home tanpa perlu nampilin landing page lagi.
    async function checkLogin() {
      const res = await fetch("/api/me");
      const data = await res.json();
      const app = document.getElementById("app");

      if (data.loggedIn) {
        // Sudah login -> gak perlu di sini, redirect ke dashboard
        window.location.replace("/home");
        return;
      }

      // Belum login -> tampilkan landing page + tombol login
      app.innerHTML = `
        <h1>Project Showcase</h1>
        <p>Kumpulan proyek lama gua, di-gate biar cuma orang tertentu yang bisa akses. Login dulu ya.</p>
        <a class="btn-google" href="/api/auth/login">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.9 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.4 26.7 36 24 36c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C40.9 35.9 44 30.4 44 24c0-1.3-.1-2.5-.4-3.5z"/>
          </svg>
          Login dengan Google
        </a>
      `;
    }

    checkLogin();
  </script>
</body>
</html>
