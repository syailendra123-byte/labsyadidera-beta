<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/topicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabSyadidera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #f1f5f9;
      overflow-x: hidden;
    }
    /* Animated background particles */
    .bg-particles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      background: rgba(56, 189, 248, 0.3);
      border-radius: 50%;
      animation: float 15s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
    }
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 56px 44px;
      text-align: center;
      max-width: 440px;
      width: 90%;
      box-shadow: 
        0 25px 80px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.05) inset;
      animation: cardEnter 0.6s ease-out;
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .logo-icon {
      width: 64px; height: 64px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 8px 32px rgba(56, 189, 248, 0.3);
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(56, 189, 248, 0.3); }
      50% { box-shadow: 0 8px 40px rgba(56, 189, 248, 0.5); }
    }
    .card h1 {
      font-size: 28px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .card .subtitle {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      margin: 0 0 32px 0;
    }
    .btn-google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #ffffff;
      color: #1e293b;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 320px;
      position: relative;
      overflow: hidden;
    }
    .btn-google::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.5s ease;
    }
    .btn-google:hover::before {
      left: 100%;
    }
    .btn-google:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255,255,255,0.2), 0 4px 16px rgba(0,0,0,0.2);
    }
    .btn-google:active {
      transform: translateY(0);
    }
    .btn-google svg {
      flex-shrink: 0;
    }
    .security-note {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .security-note svg {
      width: 14px; height: 14px;
      color: #38bdf8;
    }
    .loading {
      color: #64748b;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(100, 116, 139, 0.3);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="bg-particles" id="particles"></div>

  <div id="app" class="card">
    <p class="loading"><span class="spinner"></span> Memuat...</p>
  </div>

  <script>
    // Generate background particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 15 + 's';
      p.style.animationDuration = (10 + Math.random() * 10) + 's';
      particlesContainer.appendChild(p);
    }

    // Cek status login begitu halaman dibuka.
    // Kalau ternyata SUDAH login (misal cookie masih valid), langsung
    // tendang ke /home tanpa perlu nampilin landing page lagi.
    async function checkLogin() {
      const res = await fetch("/api/me");
      const data = await res.json();
      const app = document.getElementById("app");

      if (data.loggedIn) {
        // Sudah login -> gak perlu di sini, redirect ke dashboard
        window.location.replace("/home");
        return;
      }

      // Belum login -> tampilkan landing page + tombol login
      app.innerHTML = `
        <div class="logo-icon">L</div>
        <h1>LabSyadidera</h1>
        <p class="subtitle">Kumpulan proyek pribadi lama yang pernah dibangun, di-gate biar cuma orang tertentu yang bisa akses. Login dulu ya.</p>
        <div class="divider"></div>
        <a class="btn-google" href="/api/auth/login">
          <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.9 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.4 26.7 36 24 36c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C40.9 35.9 44 30.4 44 24c0-1.3-.1-2.5-.4-3.5z"/>
          </svg>
          Login dengan Google
        </a>
        <div class="security-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Aman & terenkripsi via OAuth 2.0
        </div>
      `;
    }

    checkLogin();
  </script>
</body>
</html>
